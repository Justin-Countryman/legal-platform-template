name: CI

# v0.1.0 shipped only the gating guards that can pass against a clean template.
# Lint and typecheck were deferred to v0.2.0 on the assumption that they needed
# the Sample Firm seed and a CI-scoped scratch Sanity project. That assumption
# was wrong for these two: neither `eslint` nor `tsc --noEmit` reads a dataset,
# so both run offline against a clean checkout and are wired below. What still
# genuinely waits on the seed + a non-sentinel projectId is a Sanity-backed
# STUDIO BUILD and a full `next build` (page-data collection instantiates the
# Sanity client and fails on the sentinel projectId) — those remain unwired.
#
# NOTE ON SCOPE: this file is the TEMPLATE's CI, and nothing else runs it. A
# client repo does not inherit it and receives NO workflow at all. Changes here
# affect the template only.
#
# CORRECTED 2026-07-31. The note that stood here said a client repo received the
# MONOREPO's .github/workflows/ci.yml instead, because Deploy-Setup-Tool's
# allowlist entry `trees: - source: .github` resolved against the monorepo root.
# That entry was emptied by ruling 2026-07-27 — the same day this note was
# written — and `BE/Deploy-Setup-Tool/deploy-allowlist.yaml` now reads
# `trees: []` with `.github/` listed under `explicitly_omitted`. The monorepo
# has no .github/ directory in any case, so the fallback this note described
# never happened. Verified against the artifact: the provisioned client repo
# carries no .github/ at all.
#
# The original reasoning, preserved because it is the evidence for whether the
# reversal was right: a client repo should be gated like any other. The ruling
# reversed it on two grounds — nobody writes code in a generated client repo, so
# there is nothing for CI to gate, and Vercel deploys on push regardless of
# Actions status (proven on Dudley, where 5 of 5 runs were red while production
# deployed). Correctness is enforced HERE, upstream, before anything reaches a
# client.

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  template-scrub-guard:
    name: Template scrub guard
    runs-on: ubuntu-latest
    # REPLACED the hardcoded blocklist 2026-07-27. The old guard grepped for one
    # RETIRED client's name fragments and Sanity project ID, so it only ever
    # caught the clients someone had remembered to add -- a CURRENT client's
    # domain leaking into the template passed it untouched, which is the gap
    # OUTSTANDING recorded for months. Adding today's client would have fixed it
    # until the next one, and the template cannot derive a roster the way the
    # monorepo guard does because `Clients/` does not exist in this repository.
    #
    # The rule is inverted instead: THE TEMPLATE IS A BLANK STARTING POINT. The
    # only firm domain and Sanity project ID that belong in it are the sample
    # firm's own placeholders; anything else is a leak, whoever it belongs to,
    # including clients that do not exist yet. An allowlist of what belongs
    # needs no human to remember every new client. It never needs updating.
    #
    # Pure Node, no dependencies -- so no `npm ci` step, and the check cannot
    # break on an install. Provenance: OUTSTANDING items 76-79.
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Verify the template carries no firm identity
        run: node scripts/check-template-is-blank.mjs

  seed-validation:
    # RENAMED 2026-07-31, from "Sample Firm seed presence". The old name
    # described the informational step rather than the assertion, and NO SEED
    # IS COMMITTED TODAY — monorepo `BI/OUTSTANDING.md` item 43 owes it and
    # authoring it is the operator's. So a REQUIRED status check called "seed
    # presence" was reporting a green tick while asserting nothing at all: the
    # presence step is informational by ruling, and the singleton guard below
    # returns early because it has no file to read. A required context that
    # reports success for a check that did not run is indistinguishable from
    # one that works, which is the failure shape this platform keeps paying
    # for. Tracked as monorepo item 108, which stays open pointing at item 43.
    #
    # The name now states the one thing this job actually asserts. NOTHING
    # ABOUT THE GUARD'S LOGIC CHANGED — it was proven able to fail on
    # 2026-07-31 by feeding it a seed carrying `drafts.designSettings`, and
    # that proof still stands. The branch-protection required context was
    # renamed in the same operation, adding the new name before the old one
    # was removed, so `main` was never gated on a context that no longer
    # reports.
    #
    # WHEN THE SEED LANDS (item 43), the presence step is where the promised
    # hard-fail belongs: at that point absence becomes a real regression
    # rather than a state the repository has always been in. See
    # `studio/seedData/regenerate.md`.
    name: Seed carries no create-only singletons
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Report whether a seed is committed (asserts nothing)
        run: |
          # The seed is a TEMPLATE-DEVELOPMENT rendering fixture ONLY. It is
          # NEVER imported into a client's dataset — ruled 2026-07-23 (monorepo
          # BI/OUTSTANDING.md item 43: no fake content on real client sites);
          # the Client Provisioning Tool's import path was removed under that
          # ruling, and its absence is pinned by test. A missing seed therefore
          # harms no client and is NOT a failure — this step is informational.
          # (A prior version promised a v0.2.0 hard-fail on absence; that
          # promise died with the ruling.)
          if [ ! -s studio/seedData/sampleFirm.ndjson ]; then
            echo "NEUTRAL: no seed is committed, so NOTHING WAS ASSERTED about one."
            echo "This step reports a fact and passes no judgement on it. The job's"
            echo "only assertion is the next step, and it has no file to read either."
            echo "Harmless for clients (the seed is never imported into a client"
            echo "dataset, ruled 2026-07-23), and it means template development has"
            echo "no rendering fixture. Owed by monorepo OUTSTANDING item 43; this"
            echo "job's silence is tracked as item 108."
            echo "::notice::No seed committed — this job asserted nothing on this run. See studio/seedData/regenerate.md."
            exit 0
          fi
          echo "Seed file present ($(wc -l < studio/seedData/sampleFirm.ndjson) lines)."

      # Presence is informational. THIS IS A HARD FAIL, and it is the point.
      #
      # Site Build composes six configuration singletons and writes each of them
      # CREATE-ONLY: if the document already exists in the dataset, the composed
      # version is thrown away and the existing one preserved. That is intended,
      # and it is what protects the design an operator tuned in Studio from being
      # clobbered by a rebuild.
      #
      # Any dataset the seed lands in BEFORE Site Build runs, a seed carrying
      # those documents WINS the create-only race, permanently and silently:
      # the dataset inherits the sample firm's design, navigation, footer,
      # global CTA and site settings, and the documents composed from real data
      # are discarded. The failure mode is a PRESERVE, not a warning. It reports
      # "Warnings: 0" and exits 0. It looks exactly like a successful build.
      #
      # Since 2026-07-23 NO tool imports the seed anywhere (the Client
      # Provisioning Tool's import path was removed under the no-fake-content
      # ruling — monorepo BI/OUTSTANDING.md item 43). The only remaining
      # import path is a human running `sanity dataset import` by hand into a
      # scratch/dev dataset, which regenerate.md's recovery section instructs.
      # This guard covers exactly that path, and it stays because the seed's
      # OWN regeneration spec once told its author to include the singletons,
      # and a raw `sanity dataset export` emits them by default. The landmine
      # was the documented procedure, so a rule that lives only in a document
      # is not enough. It has to fail here.
      - name: Verify the seed carries no create-only singleton documents
        run: |
          set -euo pipefail
          SEED=studio/seedData/sampleFirm.ndjson
          if [ ! -s "$SEED" ]; then
            echo "NEUTRAL: no seed exists, so THIS GUARD DID NOT RUN."
            echo "A green tick on this job today means the guard found nothing to"
            echo "read, NOT that a seed was inspected and cleared. The guard's"
            echo "logic is sound and was proven able to fail on 2026-07-31 against"
            echo "a seed carrying drafts.designSettings; it has no input."
            echo "::notice::Singleton guard did not run — no seed exists to inspect. Monorepo OUTSTANDING items 43 and 108."
            exit 0
          fi

          # Must match BE/_shared/sanity_singletons.py::CREATE_ONLY_SINGLETONS,
          # which is bound by test to Site Build's COMPOSER_REGISTRY. If a seventh
          # create-only singleton is ever added there, add it here too.
          SINGLETONS='["siteSettings","designSettings","mainNavigation","footerSettings","globalCta","redirects"]'

          # Matches on _type AND on _id, drafts. prefix included: a draft singleton
          # is still a singleton. A malformed seed fails jq, which fails the job,
          # which is correct: an unparseable seed is not a passing seed.
          # Both fields are bound BEFORE the pipe into index(). Inside `$s | index(X)`
          # jq rebinds `.` to $s, so a bare `._type` there indexes the ARRAY, not the
          # document, and the filter dies on every real seed. It failed closed rather
          # than open, but only by luck. Caught by running this against a dirty seed.
          OFFENDERS=$(jq -r --argjson s "$SINGLETONS" '
            ((._id // "") | sub("^drafts\\."; "")) as $id
            | (._type // "") as $type
            | select(($s | index($id)) != null or ($s | index($type)) != null)
            | "  \(._id // "<no _id>")  (_type: \($type))"
          ' "$SEED")

          if [ -n "$OFFENDERS" ]; then
            echo "::error::The seed carries documents Site Build writes create-only."
            echo "The following documents must NOT be in sampleFirm.ndjson:"
            echo "$OFFENDERS"
            echo ""
            echo "Importing them into a client's dataset before Site Build runs means"
            echo "Site Build PRESERVES them and discards the documents it composed from"
            echo "that client's own data. Every client would silently inherit the sample"
            echo "firm's design, navigation, footer, global CTA and site settings."
            echo "There is no warning and no non-zero exit. It looks like success."
            echo ""
            echo "Fix: filter them out at export. See studio/seedData/regenerate.md."
            exit 1
          fi
          echo "Seed carries no create-only singletons."

  typegen-freshness:
    name: Sanity types freshness
    runs-on: ubuntu-latest
    # Guards against generated Sanity types drifting from the schema + GROQ
    # queries — the failure that let the footerSettings socials types (sameAs /
    # superLawyers / lawInfo) go stale: a query or schema field changes and
    # nobody re-runs `npm run typegen`, so site/types/sanity.types.ts silently
    # describes the old shape. This job regenerates from source and fails if the
    # committed schema.json or types differ.
    #
    # ─── REBUILT 2026-08-10. It could not fail on the schema half, and the way
    # it failed was by REPORTING SUCCESS. ─────────────────────────────────────
    #
    # Monorepo BI/OUTSTANDING.md item 165, confirmed by observation. The old
    # version substituted a format-valid placeholder projectId into
    # sanity.config.ts, and `sanity schema extract` then threw CorsOriginError
    # out of the auth store's getCurrentUser bootstrap BEFORE writing anything.
    # `|| true` swallowed that. The guard-the-guard `jq -e . schema.json` read
    # the STALE COMMITTED FILE, which is valid JSON and passes. And
    # `git diff --exit-code studio/schema.json` then compared an untouched file
    # against itself: green by construction, on every push, for months. It was
    # hiding real drift while it did so — ogTitle and ogDescription had landed
    # on 22 document types with neither artifact regenerated.
    #
    # THE OLD COMMENT HERE STATED THE MECHANISM THIS JOB DID NOT HAVE: it said
    # `schema extract` "CORS-fails against the placeholder project, yet still
    # writes the correct schema.json". That sentence is false and was the reason
    # the jq assertion was thought sufficient. It is quoted rather than deleted
    # because it is the evidence for why this rebuild was needed.
    #
    # What changed, in three parts:
    #
    #  1. NOTHING IS REACHED OVER THE NETWORK. studio/sanity.config.ts supplies
    #     Sanity's own createMockAuthStore when SANITY_STUDIO_OFFLINE_SCHEMA_EXTRACT=1,
    #     so the identity call never happens and extraction runs against the
    #     local schema files with the shipped sentinel projectId in place. No
    #     real, scratch or borrowed project id is involved — a throwaway project
    #     has already been deleted out from under this platform once
    #     (OUTSTANDING item 22), and a check that depends on one can regress the
    #     same way. PROVEN: the schema this path extracts is byte-identical to
    #     the committed schema.json the authenticated procedure produced.
    #
    #  2. NO EXIT CODE IS TOLERATED. Both commands exit 0 on this path, measured
    #     rather than assumed, so a non-zero exit is now a real failure and says
    #     so. The output assertions stay as belt: a zero exit that writes nothing
    #     must not read as "no drift".
    #
    #  3. THE JOB PROVES IT CAN FAIL, on every run. A guard that only ever
    #     reports zero is indistinguishable from a guard that does nothing, and
    #     this one WAS doing nothing. check-typegen-detects-drift.mjs plants a
    #     field into a document schema, regenerates, and requires the drift to
    #     appear — then restores and requires the restore to be byte-exact. Same
    #     shape as the falsifiability step in `unknown-utility-classes` below.
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install studio deps
        working-directory: studio
        run: npm ci
      # AND THE SITE'S, which this job did not do and needed to.
      #
      # Monorepo OUTSTANDING item 22, failure 1, open since 2026-07-19 and still
      # live: studio/schemas/documents/designSettings.ts imports ColorPreview,
      # which imports ../../site/lib/designTokens, which imports `culori`. Node
      # resolves from the file performing the import, so `culori` is looked for
      # in site/node_modules no matter which package pulled the chain — and this
      # job installed studio only. CI run 29705096717 confirmed the resulting
      # `Cannot find module 'culori'` in 2026-07.
      #
      # It stayed invisible because the CorsOriginError arrived first and `||
      # true` swallowed both. With the extraction fixed and the exit code no
      # longer tolerated, this would have turned a silent green into a red main
      # on the first push. REPRODUCED rather than reasoned: moving
      # site/node_modules aside locally reproduces the exact module error above,
      # and installing it is what makes extraction succeed.
      #
      # THIS IS A WORKAROUND AND NOT A FIX. Item 22's option (1) — extracting the
      # colour-derivation core into a package both sides consume — is the fix,
      # and it is unscheduled. What lands here is that item's option (2),
      # install site deps in CI as well, which costs one install and leaves the
      # cross-package import exactly where it is. A developer who installs studio
      # deps alone still cannot run `npm run typegen`.
      - name: Install site deps (the studio config imports site/lib)
        working-directory: site
        run: npm ci
      - name: Regenerate schema + types from source
        working-directory: studio
        env:
          SANITY_STUDIO_OFFLINE_SCHEMA_EXTRACT: '1'
        run: |
          set -euo pipefail
          npm run schema:extract
          jq -e . schema.json >/dev/null \
            || { echo "::error::schema extract exited 0 without producing valid schema.json"; exit 1; }

          npx sanity typegen generate 2>&1 | tee typegen.log
          grep -q "Generated TypeScript types for" typegen.log \
            || { echo "::error::typegen generate exited 0 without emitting types"; exit 1; }
          rm -f typegen.log
      - name: Fail if committed schema/types are stale
        run: |
          if ! git diff --exit-code studio/schema.json site/types/sanity.types.ts; then
            echo "::error::Generated Sanity types are stale. Run 'npm run typegen:offline' in studio/ and commit studio/schema.json + site/types/sanity.types.ts."
            exit 1
          fi
          echo "Sanity schema + generated types are up to date."
      - name: Check the freshness guard still fails on planted drift
        # This is the step whose absence made the four-month silence possible.
        # It runs AFTER the diff above, so a genuine staleness is reported as
        # staleness rather than as a dirty tree.
        run: node scripts/check-typegen-detects-drift.mjs

  lint:
    name: Lint (eslint)
    runs-on: ubuntu-latest
    # The platform ships 17 custom `platform/*` rules encoding locked doctrine —
    # cascade discipline, token-first colour, heading semantics, footer landmark
    # naming, the mobile h1 cap. Until this job existed NONE of them could block
    # anything: `npm run lint` was never wired into CI and is not on the path to
    # a deploy, so a rule violation reached main and stayed there. Two did, and
    # went unnoticed long enough to become "the pre-existing baseline".
    #
    # eslint reads no dataset and makes no network call, so it passes against a
    # clean template checkout with no Sanity project and no seed.
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install site deps
        working-directory: site
        run: npm ci
      - name: Lint
        working-directory: site
        # --max-warnings=0 so an unused eslint-disable directive (a warning, not
        # an error) cannot accumulate silently. One already had.
        run: npx eslint --max-warnings=0

  typecheck:
    name: Typecheck (tsc)
    runs-on: ubuntu-latest
    # `next build` runs tsc, but the build cannot complete on a clean template:
    # page-data collection instantiates the Sanity client and dies on the
    # scrubbed sentinel projectId. So the type check that the build would have
    # given us never ran in CI either. `tsc --noEmit` alone needs no dataset and
    # no network, and the generated Sanity types are committed, so it runs here.
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install site deps
        working-directory: site
        run: npm ci
      - name: Typecheck
        working-directory: site
        run: npx tsc --noEmit

  unknown-utility-classes:
    name: Tailwind utility names resolve
    runs-on: ubuntu-latest
    # Tailwind emits no CSS for a class it does not recognise, and raises no
    # error. A misspelled utility therefore type-checks, lints, builds and tests
    # green, and the only symptom is a style silently absent from the rendered
    # page. `bg-surface-muted` and `shadow-card` shipped that way on the card
    # surface of all five homepage block components — every card computed
    # background-color: rgba(0,0,0,0) and box-shadow: none, and the composed
    # homepage read as unstyled text on white. Nothing fired. Fixed 2026-07-21
    # (a2b0edc); `border-on-dark` had done the same thing in WS4.
    #
    # This job is the thing that fires. It lives in CI rather than in `npm run
    # lint` because lint is not wired into CI at all and is not run on the way
    # to a deploy — a check for an invisible failure mode has to run somewhere
    # nobody has to remember it. It needs no Sanity project, no seed and no
    # network, so unlike a full build it can pass against a clean template.
    #
    # Provenance: monorepo BI/OUTSTANDING.md item 56.
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install site deps
        working-directory: site
        run: npm ci
      - name: Check every Tailwind class name resolves to CSS
        working-directory: site
        run: npm run check:classes
      - name: Check the checker still fails on the classes that shipped broken
        working-directory: site
        # A guard that only ever reports zero is indistinguishable from a guard
        # that does nothing, and this one would go green if its extractor
        # silently stopped collecting. Run its own falsifiability tests, which
        # plant `bg-surface-muted` / `shadow-card` in a file on disk and require
        # a non-empty report naming the file and line.
        run: npx vitest run scripts/__tests__/check-unknown-utility-classes.test.ts

  a11y-shared-components:
    name: Shared component a11y invariants
    runs-on: ubuntu-latest
    # Fleet-wide accessibility contracts for the shared blog collection
    # components (RelatedPosts / BlogIndexFallback / BlogIndexClient): explicit
    # role="list" collection semantics, and unique "Read More" link names that
    # carry the post title (WCAG 2.4.4 Link Purpose — a page of identical
    # "Read More" links is a screen-reader failure). A regression ships to every
    # client site built from this template at once, so it fails CI here instead
    # of surfacing in a per-client QA pass.
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install site deps
        working-directory: site
        run: npm ci
      - name: Run shared-component a11y tests
        working-directory: site
        run: npx vitest run components/sections/__tests__/a11y-shared-components.test.tsx

  redirects-wiring:
    name: "Redirects: one source, and nothing it drops is dropped in silence"
    runs-on: ubuntu-latest
    # TECH-9's guard, made a gate rather than a habit. `CS/redirects.csv` is the
    # only store; the build flattens a chain, keeps the first of two rows
    # claiming one source, and emits NO rule for a loop. Every one of those is a
    # row the operator wrote that is not served as written, so every one is
    # reported into the build log.
    #
    # It runs in CI rather than under the manual verification gate because the
    # thing being guarded IS a silence. Until 2026-08-17 there were two stores
    # and this job guarded their reconciliation; the failure that shape produced
    # was silent by construction, an operator adding a redirect in Studio,
    # publishing, and changing nothing. Deleting the second store removed that
    # class, and a dropped row is the silence that remains.
    # `OUTSTANDING.md` item 159's six loadRedirects behaviours ride the same file.
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install site deps
        working-directory: site
        run: npm ci
      - name: Run the redirect parse, resolution and report tests
        working-directory: site
        run: npx vitest run lib/__tests__/redirects.test.ts
