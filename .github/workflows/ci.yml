name: CI

# v0.1.0 shipped only the gating guards that can pass against a clean template.
# Lint and typecheck were deferred to v0.2.0 on the assumption that they needed
# the Sample Firm seed and a CI-scoped scratch Sanity project. That assumption
# was wrong for these two: neither `eslint` nor `tsc --noEmit` reads a dataset,
# so both run offline against a clean checkout and are wired below. What still
# genuinely waits on the seed + a non-sentinel projectId is a Sanity-backed
# STUDIO BUILD and a full `next build` (page-data collection instantiates the
# Sanity client and fails on the sentinel projectId) — those remain unwired.
#
# NOTE ON SCOPE: this file is the TEMPLATE's CI. Client repos do not inherit it.
# Deploy-Setup-Tool's allowlist (`trees: - source: .github`) resolves against the
# MONOREPO root, so a client repo receives the monorepo's .github/workflows/ci.yml
# instead. Changes here affect the template only.

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  template-scrub-guard:
    name: Template scrub guard
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify no client-identity leaks
        run: |
          set -e
          echo "Checking for accidental client identity strings..."

          # ── Why the patterns below are assembled from fragments ────────────
          # This guard now scans YAML, and this file IS YAML. If the strings it
          # searches for appeared here as plain literals, the guard would match
          # ITSELF on every run and no checkout could ever pass.
          #
          # The obvious alternative — excluding this file, or .github, from the
          # scan — is WRONG, and the reason is the whole point of widening it: a
          # workflow file is exactly where the last leak lived. The monorepo's
          # ci.yml hardcoded a retired client's Sanity project ID and site
          # domain in an `env:` block and shipped that file into every client
          # repo (OUTSTANDING item 76). Blinding this guard to its own file type
          # would rebuild the hole it exists to close.
          #
          # So the literals are split instead, and reassembled at run time. The
          # file stays fully scannable, including itself.
          # DO NOT "tidy" these back into plain strings — that silently breaks
          # the guard by making it fail on every run.
          HS_A="$(printf '%s' 'henning' 'son')"
          HS_B="$(printf '%s' 'snox' 'ell')"
          HS_C="$(printf '%s' 'hennsnox' 'law')"
          HS_PID="$(printf '%s' '5lyox4' 'tc')"
          NAME_RE="${HS_A}|${HS_B}|${HS_C}"

          # Audit-citation comments referencing the H&S source folder BY PATH
          # are intentionally preserved — either the live path or the
          # post-retirement `_archive` one. A raw identity literal without the
          # path still trips the guard.
          AUDIT_PATH_RE="Clients/(_archive/)?${HS_A}-${HS_B}-ltd/"

          # One include list for both checks. They used to differ — the identity
          # check omitted .md and the project-ID check omitted .jsx/.css — which
          # is the same class of gap as the missing .yml, just smaller.
          INCLUDES=(
            --include='*.ts'  --include='*.tsx'  --include='*.js'
            --include='*.jsx' --include='*.json' --include='*.css'
            --include='*.md'  --include='*.yml'  --include='*.yaml'
          )
          EXCLUDES=(
            --exclude-dir=node_modules --exclude-dir=.next
            --exclude-dir=dist --exclude-dir=.sanity
          )

          if grep -rniE "$NAME_RE" "${INCLUDES[@]}" "${EXCLUDES[@]}" . \
               | grep -v -E "$AUDIT_PATH_RE"; then
            echo "::error::Client identity strings leaked into template source"
            exit 1
          fi
          if grep -rn "$HS_PID" "${INCLUDES[@]}" "${EXCLUDES[@]}" .; then
            echo "::error::Retired H&S Sanity project ID leaked into template"
            exit 1
          fi
          echo "Template scrub guard passed (source, docs, workflows and YAML)."

  seed-validation:
    name: Sample Firm seed presence
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify seed file presence
        run: |
          # The seed is a TEMPLATE-DEVELOPMENT rendering fixture ONLY. It is
          # NEVER imported into a client's dataset — ruled 2026-07-23 (monorepo
          # BI/OUTSTANDING.md item 43: no fake content on real client sites);
          # the Client Provisioning Tool's import path was removed under that
          # ruling, and its absence is pinned by test. A missing seed therefore
          # harms no client and is NOT a failure — this step is informational.
          # (A prior version promised a v0.2.0 hard-fail on absence; that
          # promise died with the ruling.)
          if [ ! -s studio/seedData/sampleFirm.ndjson ]; then
            echo "::notice::studio/seedData/sampleFirm.ndjson is not committed — fine for clients (never imported), but template development has no rendering fixture. See studio/seedData/regenerate.md."
            exit 0
          fi
          echo "Seed file present ($(wc -l < studio/seedData/sampleFirm.ndjson) lines)."

      # Presence is informational. THIS IS A HARD FAIL, and it is the point.
      #
      # Site Build composes six configuration singletons and writes each of them
      # CREATE-ONLY: if the document already exists in the dataset, the composed
      # version is thrown away and the existing one preserved. That is intended,
      # and it is what protects the design an operator tuned in Studio from being
      # clobbered by a rebuild.
      #
      # Any dataset the seed lands in BEFORE Site Build runs, a seed carrying
      # those documents WINS the create-only race, permanently and silently:
      # the dataset inherits the sample firm's design, navigation, footer,
      # global CTA and site settings, and the documents composed from real data
      # are discarded. The failure mode is a PRESERVE, not a warning. It reports
      # "Warnings: 0" and exits 0. It looks exactly like a successful build.
      #
      # Since 2026-07-23 NO tool imports the seed anywhere (the Client
      # Provisioning Tool's import path was removed under the no-fake-content
      # ruling — monorepo BI/OUTSTANDING.md item 43). The only remaining
      # import path is a human running `sanity dataset import` by hand into a
      # scratch/dev dataset, which regenerate.md's recovery section instructs.
      # This guard covers exactly that path, and it stays because the seed's
      # OWN regeneration spec once told its author to include the singletons,
      # and a raw `sanity dataset export` emits them by default. The landmine
      # was the documented procedure, so a rule that lives only in a document
      # is not enough. It has to fail here.
      - name: Verify the seed carries no create-only singleton documents
        run: |
          set -euo pipefail
          SEED=studio/seedData/sampleFirm.ndjson
          if [ ! -s "$SEED" ]; then
            echo "No seed committed, so there is nothing to check."
            exit 0
          fi

          # Must match BE/_shared/sanity_singletons.py::CREATE_ONLY_SINGLETONS,
          # which is bound by test to Site Build's COMPOSER_REGISTRY. If a seventh
          # create-only singleton is ever added there, add it here too.
          SINGLETONS='["siteSettings","designSettings","mainNavigation","footerSettings","globalCta","redirects"]'

          # Matches on _type AND on _id, drafts. prefix included: a draft singleton
          # is still a singleton. A malformed seed fails jq, which fails the job,
          # which is correct: an unparseable seed is not a passing seed.
          # Both fields are bound BEFORE the pipe into index(). Inside `$s | index(X)`
          # jq rebinds `.` to $s, so a bare `._type` there indexes the ARRAY, not the
          # document, and the filter dies on every real seed. It failed closed rather
          # than open, but only by luck. Caught by running this against a dirty seed.
          OFFENDERS=$(jq -r --argjson s "$SINGLETONS" '
            ((._id // "") | sub("^drafts\\."; "")) as $id
            | (._type // "") as $type
            | select(($s | index($id)) != null or ($s | index($type)) != null)
            | "  \(._id // "<no _id>")  (_type: \($type))"
          ' "$SEED")

          if [ -n "$OFFENDERS" ]; then
            echo "::error::The seed carries documents Site Build writes create-only."
            echo "The following documents must NOT be in sampleFirm.ndjson:"
            echo "$OFFENDERS"
            echo ""
            echo "Importing them into a client's dataset before Site Build runs means"
            echo "Site Build PRESERVES them and discards the documents it composed from"
            echo "that client's own data. Every client would silently inherit the sample"
            echo "firm's design, navigation, footer, global CTA and site settings."
            echo "There is no warning and no non-zero exit. It looks like success."
            echo ""
            echo "Fix: filter them out at export. See studio/seedData/regenerate.md."
            exit 1
          fi
          echo "Seed carries no create-only singletons."

  typegen-freshness:
    name: Sanity types freshness
    runs-on: ubuntu-latest
    # Guards against generated Sanity types drifting from the schema + GROQ
    # queries — the failure that let the footerSettings socials types (sameAs /
    # superLawyers / lawInfo) go stale: a query or schema field changes and
    # nobody re-runs `npm run typegen`, so site/types/sanity.types.ts silently
    # describes the old shape. This job regenerates from source and fails if the
    # committed schema.json or types differ.
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install studio deps
        working-directory: studio
        run: npm ci
      - name: Regenerate schema + types from source
        working-directory: studio
        run: |
          set -u
          # The template config ships a SCRUBBED sentinel projectId
          # (TEMPLATE_SANITY_PROJECT_ID) that fails Sanity's projectId format
          # validator (a-z, 0-9 and dashes only), which blocks `schema extract`
          # before it can read the local schema files. Substitute a THROWAWAY
          # format-valid placeholder for the CI run ONLY. This is not a real,
          # scratch, or client project — it just satisfies the string validator
          # so extraction runs offline against the local schema. It lives only
          # in the ephemeral CI checkout and is never committed; the freshness
          # diff below inspects schema.json + the generated types, not the
          # config, so this substitution cannot affect the result.
          sed -i "s/'TEMPLATE_SANITY_PROJECT_ID'/'ci0placeholder'/" sanity.config.ts

          # Both commands exit non-zero for benign reasons unrelated to
          # freshness, so the git diff — not the exit code — is authoritative:
          #  - `schema extract` makes a background getCurrentUser call that
          #    CORS-fails against the placeholder project, yet still writes the
          #    correct schema.json (projectId is config, not part of the schema).
          #  - `typegen generate` warns on the INTERNAL_HERO_OVERRIDE_FIELDS
          #    partial-GROQ fragment (interpolated into real queries, parsed
          #    standalone), yet still emits every real query type.
          # Tolerate the exit codes but assert each step produced valid output,
          # so a genuine crash that writes nothing can't masquerade as "no drift".
          npm run schema:extract || true
          jq -e . schema.json >/dev/null \
            || { echo "::error::schema extract did not produce valid schema.json"; exit 1; }

          npx sanity typegen generate 2>&1 | tee typegen.log || true
          grep -q "Generated TypeScript types for" typegen.log \
            || { echo "::error::typegen generate did not emit types"; exit 1; }
      - name: Fail if committed schema/types are stale
        run: |
          if ! git diff --exit-code studio/schema.json site/types/sanity.types.ts; then
            echo "::error::Generated Sanity types are stale. Run 'npm run typegen' in studio/ and commit studio/schema.json + site/types/sanity.types.ts."
            exit 1
          fi
          echo "Sanity schema + generated types are up to date."

  lint:
    name: Lint (eslint)
    runs-on: ubuntu-latest
    # The platform ships 17 custom `platform/*` rules encoding locked doctrine —
    # cascade discipline, token-first colour, heading semantics, footer landmark
    # naming, the mobile h1 cap. Until this job existed NONE of them could block
    # anything: `npm run lint` was never wired into CI and is not on the path to
    # a deploy, so a rule violation reached main and stayed there. Two did, and
    # went unnoticed long enough to become "the pre-existing baseline".
    #
    # eslint reads no dataset and makes no network call, so it passes against a
    # clean template checkout with no Sanity project and no seed.
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install site deps
        working-directory: site
        run: npm ci
      - name: Lint
        working-directory: site
        # --max-warnings=0 so an unused eslint-disable directive (a warning, not
        # an error) cannot accumulate silently. One already had.
        run: npx eslint --max-warnings=0

  typecheck:
    name: Typecheck (tsc)
    runs-on: ubuntu-latest
    # `next build` runs tsc, but the build cannot complete on a clean template:
    # page-data collection instantiates the Sanity client and dies on the
    # scrubbed sentinel projectId. So the type check that the build would have
    # given us never ran in CI either. `tsc --noEmit` alone needs no dataset and
    # no network, and the generated Sanity types are committed, so it runs here.
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install site deps
        working-directory: site
        run: npm ci
      - name: Typecheck
        working-directory: site
        run: npx tsc --noEmit

  unknown-utility-classes:
    name: Tailwind utility names resolve
    runs-on: ubuntu-latest
    # Tailwind emits no CSS for a class it does not recognise, and raises no
    # error. A misspelled utility therefore type-checks, lints, builds and tests
    # green, and the only symptom is a style silently absent from the rendered
    # page. `bg-surface-muted` and `shadow-card` shipped that way on the card
    # surface of all five homepage block components — every card computed
    # background-color: rgba(0,0,0,0) and box-shadow: none, and the composed
    # homepage read as unstyled text on white. Nothing fired. Fixed 2026-07-21
    # (a2b0edc); `border-on-dark` had done the same thing in WS4.
    #
    # This job is the thing that fires. It lives in CI rather than in `npm run
    # lint` because lint is not wired into CI at all and is not run on the way
    # to a deploy — a check for an invisible failure mode has to run somewhere
    # nobody has to remember it. It needs no Sanity project, no seed and no
    # network, so unlike a full build it can pass against a clean template.
    #
    # Provenance: monorepo BI/OUTSTANDING.md item 56.
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install site deps
        working-directory: site
        run: npm ci
      - name: Check every Tailwind class name resolves to CSS
        working-directory: site
        run: npm run check:classes
      - name: Check the checker still fails on the classes that shipped broken
        working-directory: site
        # A guard that only ever reports zero is indistinguishable from a guard
        # that does nothing, and this one would go green if its extractor
        # silently stopped collecting. Run its own falsifiability tests, which
        # plant `bg-surface-muted` / `shadow-card` in a file on disk and require
        # a non-empty report naming the file and line.
        run: npx vitest run scripts/__tests__/check-unknown-utility-classes.test.ts

  a11y-shared-components:
    name: Shared component a11y invariants
    runs-on: ubuntu-latest
    # Fleet-wide accessibility contracts for the shared blog collection
    # components (RelatedPosts / BlogIndexFallback / BlogIndexClient): explicit
    # role="list" collection semantics, and unique "Read More" link names that
    # carry the post title (WCAG 2.4.4 Link Purpose — a page of identical
    # "Read More" links is a screen-reader failure). A regression ships to every
    # client site built from this template at once, so it fails CI here instead
    # of surfacing in a per-client QA pass.
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install site deps
        working-directory: site
        run: npm ci
      - name: Run shared-component a11y tests
        working-directory: site
        run: npx vitest run components/sections/__tests__/a11y-shared-components.test.tsx
